name: Update NPM version
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_BUMP_TOKEN }}
      - name: Get latest upstream version
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/NginxProxyManager/nginx-proxy-manager/releases/latest \
            | jq -r '.tag_name | sub("^v"; "")')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to determine upstream version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Get current base version from config.yaml
        id: current
        run: |
          RAW=$(yq -r '.version' nginxproxymanager/config.yaml)
          # Leading numeric version only, whatever suffix follows
          BASE=$(echo "$RAW" | grep -oE '^[0-9]+(\.[0-9]+)*')
          if [ -z "$BASE" ]; then
            echo "Could not parse base version from '$RAW'"
            exit 1
          fi
          echo "raw=$RAW base=$BASE"
          echo "version=$BASE" >> "$GITHUB_OUTPUT"
      - name: Check upstream is newer
        id: check
        env:
          UP: ${{ steps.upstream.outputs.version }}
          CUR: ${{ steps.current.outputs.version }}
        run: |
          NEWEST=$(printf '%s\n%s\n' "$UP" "$CUR" | sort -V | tail -n1)
          echo "upstream=$UP current_base=$CUR newest=$NEWEST"
          if [ "$UP" != "$CUR" ] && [ "$NEWEST" = "$UP" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update app
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/NginxProxyManager/nginx-proxy-manager/releases/latest)

          RELEASE_NOTES=$(echo "$RELEASE_JSON" | jq -r '.body')

          sed -i "s/^version: .*/version: \"$VERSION\"/" \
            nginxproxymanager/config.yaml

          sed -i "s/^ARG NGINX_PROXY_MANAGER_VERSION=.*/ARG NGINX_PROXY_MANAGER_VERSION=\"v$VERSION\"/" \
            nginxproxymanager/Dockerfile

          CHANGELOG_FILE="nginxproxymanager/CHANGELOG.md"

          if [ ! -f "$CHANGELOG_FILE" ]; then
            printf "# Changelog\n\n" > "$CHANGELOG_FILE"
          fi

          # Don't duplicate an existing release entry.
          if ! grep -q "^## v$VERSION$" "$CHANGELOG_FILE"; then
            TEMP=$(mktemp)

            printf "# Changelog\n\n## v%s\n\n%s\n\n" \
              "$VERSION" \
              "$RELEASE_NOTES" > "$TEMP"

            sed '1,2d' "$CHANGELOG_FILE" >> "$TEMP"

            mv "$TEMP" "$CHANGELOG_FILE"
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update NPM to v$VERSION"
          git push origin main
