name: Sync app changelogs

on:
  push:
    branches:
      - main
    paths:
      - '**/config.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync changelogs with app versions
        run: |
          set -euo pipefail

          for dir in */ ; do
            [ -f "$dir/config.yaml" ] || continue
            app="${dir%/}"

            # Accepts versions with or without a leading "v" (e.g. "4.1.0", "v2.38.1")
            version=$(sed -n 's/^version:[[:space:]]*"\?\([vV]\?[0-9][^"]*\)"\?/\1/p' "$dir/config.yaml" | head -n 1)
            if [ -z "$version" ]; then
              echo "::warning::$app: no top-level 'version:' in config.yaml, skipping"
              continue
            fi

            changelog="$dir/CHANGELOG.md"
            if [ -f "$changelog" ] && grep -Eq "^## [vV]?${version#v}" "$changelog"; then
              echo "$app: changelog already has an entry for $version"
              continue
            fi

            # Upstream project repo, in priority order:
            #   1. an "# upstream: <owner/repo>" (or github URL) comment in config.yaml
            #   2. the app's url: field, when it points at the upstream repo
            upstream=$(sed -n 's/^#[[:space:]]*upstream:[[:space:]]*//p' "$dir/config.yaml" | head -n 1)
            if [ -z "$upstream" ]; then
              upstream=$(sed -n 's/^url:[[:space:]]*"\?\([^" ]*\)"\?/\1/p' "$dir/config.yaml" | head -n 1)
            fi
            repo=""
            if grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' <<< "$upstream"; then
              repo="$upstream"
            else
              repo=$(sed -n 's#^https://github.com/\([^/]*\)/\([^/]*\)\(/.*\)\?$#\1/\2#p' <<< "$upstream")
            fi

            notes=""
            if [ -z "$repo" ]; then
              echo "::warning::$app: no upstream repo found for release notes - add an '# upstream: owner/repo' comment to config.yaml"
            else
              releases=$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$repo/releases?per_page=100" || true)
              if [ -n "$releases" ]; then
                notes=$(jq -r --arg v "${version#v}" \
                  'first(.[] | select((.tag_name | sub("^[vV]"; "")) == $v) | .body) // ""' \
                  <<< "$releases")
              fi
              if [ -z "$notes" ]; then
                echo "::warning::$app: no release notes found for $version in $repo"
              fi
            fi
            [ -n "$notes" ] || notes="Update to version $version."

            [ -f "$changelog" ] || printf '# Changelog\n\n' > "$changelog"
            TEMP=$(mktemp)
            {
              printf '# Changelog\n\n'
              printf '## %s\n\n' "$version"
              printf '%s\n\n' "$notes"
              sed '1{/^# Changelog[[:space:]]*$/d}' "$changelog" | sed '/./,$!d'
            } > "$TEMP"
            mv "$TEMP" "$changelog"
            echo "$app: added changelog entry for $version"
          done
  
          git diff --stat

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_BUMP_TOKEN }}
          branch: chore/sync-changelogs
          delete-branch: true
          commit-message: "docs: sync changelogs with app versions"
          title: "Sync app changelogs"
          body: |
            Adds missing changelog entries for the current version of each app,
            using the upstream release notes where available.
          labels: |
            automated
            documentation
