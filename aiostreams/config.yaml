name: AIOStreams
version: "2.37.0"
slug: aiostreams
description: >-
  Consolidates multiple Stremio addons and debrid 
  services into a single, highly customisable addon.
url: https://github.com/DCx91/ha-addons/aiostreams
arch:
  - amd64
  - aarch64
init: false
image: ghcr.io/dcx91/aiostreams
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: AIOStreams endpoint
map:
  - data:rw
options:
  base_url: ""
  addon_username: ""
  addon_password: ""
  verbosity: "error"
  trakt_id: ""
  anime_api: false
schema:
  base_url: url
  addon_username: str
  addon_password: password
  verbosity: list(error|warn|info|http|verbose|debug|silly)
  trakt_id: str?
  anime_api: bool
  trusted_uuid: str?
