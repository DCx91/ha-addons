name: "Music Assistant Alexa Skill"
version: "0.0.39-beta4"
slug: "music_assistant_alexa_skill"
description: "Alexa skill backend for Music Assistant"
url: "https://github.com/dcx91/music_assistant_alexa_beta"
arch:
  - aarch64
  - amd64
init: false
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "Flask web UI and Alexa skill endpoint"
map:
  - data:rw
webui: http://[HOST]:[PORT:5000]/setup
image: ghcr.io/dcx91/music_assistant_alexa_beta
options:
  skill_hostname: ""
  ma_hostname: ""
  app_username: ""
  app_password: ""
  locale: en-GB
  aws_default_region: eu-west-2
schema:
  skill_hostname: str
  ma_hostname: str
  app_username: str
  enable_apl: bool
  app_password: password
  locale: str
  aws_default_region: str
  ma_api_url: url?
  ma_api_token: str?
  skip_url_validation: bool?
  enable_apl: bool?
  debug: bool?
