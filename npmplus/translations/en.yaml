configuration:
  disable_ipv6:
    name: Disable IPv6
    description: Disables listening on IPv6 and the nginx IPv6 resolver.
  geoip2:
    name: Enable GeoIP2
    description: >-
      Loads the GeoIP2 NGINX modules, allowing custom NGINX configurations to
      use MaxMind Geolocation databases. Requires MaxMind's "GeoLite2-Country.mmdb" in /config/geoip2.
  acme_email:
    name: ACME email
    description: >-
      Email address used once to register the ACME account. Required for
      ZeroSSL and Google Public CA. Leave empty to register without email
      (Let's Encrypt only).
  initial_admin_email:
    name: Initial admin email
    description: >-
      Email of the initial admin user. Default: admin@npmplus.local
  initial_admin_password:
    name: Initial admin password
    description: >-
      Password of the initial admin user. Default: Randomly generated key
  logrotate:
    name: Logrotate
    description: >-
      Write HTTP/stream access logs to /data/nginx/logs and rotate them daily.
  trust_cloudflare:
    name: Trust Cloudflare IPs
    description: >-
      Fetch Cloudflare's IP ranges so nginx trusts the X-Forwarded-For
      header from Cloudflare and sees the real client IPs. Enable when Home
      Assistant is behind Cloudflare proxying.
