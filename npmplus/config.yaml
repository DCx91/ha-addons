# upstream: ZoeyVid/NPMplus
name: NPMplus
version: "2026.10.22"
slug: npmplus
description: >-
  NPMplus (Nginx Proxy Manager plus) as a Home Assistant app. Manage
  reverse proxy hosts, redirects, dead hosts, streams and Let's Encrypt
  certificates from within Home Assistant.
url: https://github.com/DCx91/ha-addons/blob/main/npmplus/README.md
image: ghcr.io/dcx91/npmplus
arch:
  - aarch64
  - amd64
auth_api: true
hassio_api: true
apparmor: true
map:
  - type: app_config
    read_only: false
init: false
webui: http://[HOST]:[PORT:81]
ports:
  "80/tcp": 80
  "443/tcp": 443
  "81/tcp": 81
ports_description:
  "80/tcp": HTTP traffic for proxied hosts
  "443/tcp": HTTPS traffic for proxied hosts
  "81/tcp": NPMplus admin web UI
options:
  trust_cloudflare: true
schema:
  trust_cloudflare: bool
  geoip2: bool?
  disable_ipv6: bool?
  acme_email: email?
  initial_admin_email: email?
  initial_admin_password: password?
  logrotate: bool?
