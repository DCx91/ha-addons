name: Unbound DNS
version: "1.25.2-4"
breaking_versions: "1.25.2-3"
slug: unbound
description: >-
  A validating, recursive, and caching DNS resolver
url: "https://github.com/DCx91/ha-addons/unbound"
arch:
  - aarch64
  - amd64
startup: system
hassio_api: true
init: false
image: ghcr.io/dcx91/unbound
ports:
  5335/udp:
  5335/tcp:
map:
  - app_config:rw
options:
  unbound_verbosity: 1
schema:
  unbound_verbosity: list(0|1|2|3|4|5)
  do_ipv6: bool?
  num_threads: int(1,32)?
  persist_cache: bool?
  cache_min_ttl: int(0,3600)?
  cache_max_ttl: int(60,604800)?
