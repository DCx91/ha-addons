configuration:
  unbound_verbosity:
    name: Verbosity
    description: >-
      Logging detail, from 0 (errors only) to 5 (everything!).
  do_ipv6:
    name: Use IPv6 for upstream queries
    description: >-
      Allow Unbound to contact upstream name servers over IPv6.
      This does not affect whether IPv6 addresses (AAAA) can be resolved.
      Disable if your network has no IPv6 connectivity or it is unreliable.
  num_threads:
    name: Number of threads
    description: >-
      Number of Unbound worker threads. One or two is plenty for most home
      networks. Values above the number of CPU cores are capped automatically.
  cache_min_ttl:
    name: Cache minimum TTL (seconds)
    description: >-
      Minimum time a DNS record stays cached, even if its own TTL is shorter.
      Values above an hour can cause stale or wrong answers. Default: 0 (honour each record's TTL).
  cache_max_ttl:
    name: Cache maximum TTL (seconds)
    description: >-
      Maximum time a DNS record stays cached, even if its own TTL is longer.
      Default: 86400 (24 hours).
  no_persist_cache:
    name: Disable cache persistence
    description: >-
      When enabled (the default), the cache starts empty after every restart.
      Disable this option to save the cache when the app stops and reload it
      when the app starts, so lookups stay fast after a restart.
