configuration:
  do_ipv6:
    name: Enable IPv6
    description: >-
      Enable DNS queries to upstream DNS servers over IPv6.
      IPv6 addresses can still be resolved when disabled.
      Disable if your network does not support IPv6 connectivity.
  unbound_verbosity:
    name: Verbosity
    description: >-
      Logging verbosity.Levels 3+ may significantly affect performance.
      See: https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html#unbound-conf-verbosity
  cache_min_ttl:
    name: Cache Minimum TTL (seconds)
    description: >-
      Minimum time a DNS record is held in cache. Raising this reduces
      upstream queries but may delay propagation of DNS changes. Default: 0
  cache_max_ttl:
    name: Cache Maximum TTL (seconds)
    description: >-
      Maximum time a DNS record can remain cached regardless of the record's own TTL. Default: 86400
  num_threads:
    name: Number of Threads
    description: >-
      Number of Unbound worker threads. For most home setups 1-2 is sufficient.
      Max: 32 (capped to CPU core count).
  no_persist_cache:
    name: Disable Cache Persistence
    description: >-
      By default, this app will export and re-import the cache to persist it across restarts.
      Enabling this will revert to the Unbound default of clearing it.
