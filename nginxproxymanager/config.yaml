name: Nginx Proxy Manager
version: 2.15.1
slug: nginxproxymanager
description: Manage Nginx proxy hosts with a simple, powerful interface
url: https://github.com/DCx91/ha-addons/nginxproxymanager
image: ghcr.io/dcx91/nginxproxymanager
webui: http://[HOST]:[PORT:81]
startup: services
init: false
arch:
  - aarch64
  - amd64
hassio_api: true
ports:
  80/tcp: 80
  81/tcp: 81
  443/tcp: 443
ports_description:
  80/tcp: HTTP web traffic
  81/tcp: Nginx Proxy Manager administration interface
  443/tcp: HTTPS (SSL/TLS) web traffic
map:
  - addon_config:rw
backup_exclude:
  - "*/logs"
schema:
  geoip2: bool?
  max_old_space: int?
