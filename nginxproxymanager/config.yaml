name: Nginx Proxy Manager
version: "2.16.0.2"
slug: nginxproxymanager
description: Manage Nginx proxy hosts with a simple, powerful interface
url: https://github.com/DCx91/ha-addons/nginxproxymanager
image: ghcr.io/dcx91/nginxproxymanager
startup: services
init: false
arch:
  - aarch64
  - amd64
hassio_api: true
ingress: true
ingress_port: 81
panel_icon: mdi:ip-outline
ports:
  80/tcp: 80
  443/tcp:
ports_description:
  80/tcp: HTTP web traffic
  443/tcp: HTTPS (SSL/TLS) web traffic
map:
  - app_config:rw
backup_exclude:
  - "*/logs"
options:
  geoip2: false
schema:
  geoip2: bool?
  verbose: bool?
  max_old_space: int?
