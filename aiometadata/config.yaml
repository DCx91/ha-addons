name: AIOMetadata
version: "3.8.3.1"
slug: aiometadata
description: >-
  Aggregates and enriches movie, series, and anime metadata from multiple sources,
  giving you full control over catalog sources, artwork, and search.
url: https://github.com/DCx91/ha-addons/aiometadata
image: ghcr.io/dcx91/aiometadata
arch:
  - amd64
  - aarch64
init: false
ports:
  3232/tcp: 3232
ports_description:
  3232/tcp: AIOMetadata Web UI
webui: http://[HOST]:[PORT:3232]
options:
  host_name: ""
  password: ""
  tmdb_api_key: ""
  warming_uuids: ""
  single_user: true
  poster_cache: true
  verbosity: 2
schema:
  host_name: url
  password: password?
  tmdb_api_key: str
  single_user: bool
  warming_uuids: 
    - str?
  poster_cache: bool
  verbosity: list(0|1|2|3|4|5)
  admin_key: password?
