configuration:
  host_name:
    name: Hostname
    description: >-
      Public URL used to access this addon, e.g. https://[domain].duckdns.org.
  admin_key:
    name: Admin Key
    description: >-
      Password used to gain access to /dashboard as admin.
      If left blank, a key will be generated on first run and can be viewed here.
  verbosity:
    name: Verbosity
    description: >-
      How much the server logs to the container output and to the dashboard log viewer.
      0 errors only, 1 adds warnings, 3 adds info, 4 adds debug, 5 adds trace.
  tmdb_api_key:
    name: TMDb API Key
    description: >-
      Sets the fallback API key for The Movie Database (TMDb), used to retrieve movie and TV metadata.
  tmdb_api_key:
    name: TVDb API Key
    description: >-
      Sets the fallback API key for The TV Database (TVDb), used to retrieve movie and TV metadata.
  single_user:
    name: Single User
    description: >-
      Optimises the app for personal use by disabling features and overhead intended for public instances.
  poster_cache:
    name: Cache Posters
    description: >-
      Caches posters, artwork and icons locally to improve performance and reduce repeated downloads.
  warming_uuids:
    name: Cache Warming
    description: >-
      User UUIDs to use for cache warming operations (max: 3 UUIDs).
  password:
    name: Addon Password
    description: >-
      Password protects the AIOStreams instance, blocking access to the 'configure' page for others.
